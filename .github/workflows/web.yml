# Type-check, test and build the web app on every push and pull request.
# Deploying to GitHub Pages is manual: Actions tab → "Web" → Run workflow → tick "deploy".
# (One-time setup: repository Settings → Pages → Source: "GitHub Actions".)
name: Web

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy dist/ to GitHub Pages
        type: boolean
        default: false

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      # The stats tests cover DST edge cases and need a zone with DST set before Node starts.
      - run: npm test
        env:
          TZ: Europe/Berlin
      - run: npm run build

      - name: Keep dist/ for the deploy job
        if: github.event_name == 'workflow_dispatch' && inputs.deploy
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
